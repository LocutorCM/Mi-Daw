<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<header>
<button id="play">▶ Play</button>
<button id="rec">● Rec</button>
<button id="monitor" class="i-btn">I</button>
<span>Mi DAW - Vocal</span>
</header>
<main>
<aside id="rack">
<h3>PLUGINS - VOCAL</h3>

<div class="plugin">
<b>1. EQ 8 Bandas</b>
<div id="eq"></div>
</div>

<div class="plugin">
<b>2. Compresor</b>
<label>Threshold <input type="range" id="th" min="-60" max="0" value="-20"> <span id="thVal">-20</span></label><br>
<label>Ratio <input type="range" id="ratio" min="1" max="20" value="4"> <span id="ratioVal">4</span></label><br>
<label>Attack <input type="range" id="att" min="1" max="100" value="10"> <span id="attVal">10ms</span></label><br>
<label>Release <input type="range" id="rel" min="10" max="500" value="200"> <span id="relVal">200ms</span></label>
</div>

</aside>
<section id="timeline"><div class="track"><span>Vocal</span><canvas id="wave" width="800" height="120"></canvas></div></section>
</main>
<script src="app.js"></script></body></html>
